      font-family: "Latin Modern Sans";
      src: url("../../fonts/lmsans10-bold.otf") format("opentype");
      font-weight: 700;
    }
    .lens-family text {font-family: "Latin Modern Sans", sans-serif; fill: #e0e0e0;}
    .lens-family a:hover rect, .lens-family a:focus rect {stroke: #4dabf7; stroke-width: 2.6;}
  </style>
