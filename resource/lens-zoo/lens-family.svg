<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"
     viewBox="0 0 808 545" class="lens-family" role="group" aria-labelledby="lens-family-title" aria-describedby="lens-family-description">
  <title id="lens-family-title">The Logit Lens family tree</title>
  <desc id="lens-family-description">Arrows run from parent lenses to variants. Future Lens builds on Logit Lens, Tuned Lens. Tuned Lens builds on Logit Lens. J-lens builds on Logit Lens. Coda Lens builds on Logit Lens. K-lens is the input-side counterpart of J-lens. Template Lens builds on J-lens. R-lens builds on J-lens. Chain Lens builds on Logit Lens, J-lens. S-lens builds on K-lens, R-lens. Oracle Lens builds on Template Lens. J++ Lens builds on J-lens, R-lens.</desc>
  <style>
    @font-face {
      font-family: "Latin Modern Sans";
